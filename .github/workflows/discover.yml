name: discover
on:
  workflow_dispatch:
  push:
    branches: [probe]
    paths: ["sources/**", "collector/discover.py", "collector/fetch.py", ".github/workflows/discover.yml"]
permissions:
  contents: write
concurrency: discover
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collector/discover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json
          git commit -m "Discovery results [skip ci]" || true
          git push

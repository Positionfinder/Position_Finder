name: collect
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main, probe]
    paths: ["sources/**", "collector/**", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency: collect-${{ github.ref }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collector/collect.py
      - uses: actions/upload-artifact@v4
        with: {name: debug, path: debug/, retention-days: 7}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json data/detail_cache.json data/seen.json
          git commit -m "Update positions $(date -u +%F) [skip ci]" || exit 0
          git pull --rebase || true
          git push

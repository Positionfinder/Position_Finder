name: collect
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main, "probe-strict*", "probe-collect*"]
    paths: ["sources/**", "collector/**", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency: collect-${{ github.ref }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collector/collect.py $(python -c "import yaml;print(' '.join(i['id'] for i in yaml.safe_load(open('sources/institutions.yaml')) if i.get('type')=='professional'))")
        env:
          PF_DEBUG_HTML: ${{ github.ref != 'refs/heads/main' && '1' || '0' }}
      # English titles: offline translation models (Spanish, Catalan, German -> English), cached between runs
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-v1
      - name: Install translator (CPU only)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
      - name: Translate titles to English
        continue-on-error: true
        run: python collector/translate.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json data/detail_cache.json data/seen.json
          git add data/translations.json 2>/dev/null || true
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then git add -f debug; fi
          git commit -m "Update positions $(date -u +%F) [skip ci]" || exit 0
          git pull --rebase || true
          git push

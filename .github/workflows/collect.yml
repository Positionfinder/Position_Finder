name: collect
on:
  schedule:
    # 08:00 Spain time all year: GitHub cron is UTC only, so run at both 06:07 and 07:07 UTC;
    # the "gate" job lets only the run that falls in the 08:xx hour in Madrid continue.
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
  workflow_dispatch:
  push:
    branches: [main, "probe-strict*", "probe-collect*"]
    paths: ["sources/**", "collector/**", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency: collect-${{ github.ref }}
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          h=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" != "08" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Madrid hour $h: skipped"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collector/collect.py
        env:
          PF_DEBUG_HTML: ${{ github.ref != 'refs/heads/main' && '1' || '0' }}
      # EURAXESS + Faculty Radar -> data/external_candidates.json (read by the picks task)
      - name: Read EURAXESS and Faculty Radar
        continue-on-error: true
        run: python collector/external.py
      # English titles: offline translation models (Spanish, Catalan, German -> English), cached between runs
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-v1
      - name: Install translator (CPU only)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
      - name: Translate titles to English
        continue-on-error: true
        run: python collector/translate.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/linkedin.json data/detail_cache.json data/seen.json
          git add data/external_candidates.json data/external_seen.json 2>/dev/null || true
          git add data/translations.json 2>/dev/null || true
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then git add -f debug; fi
          git commit -m "Update positions $(date -u +%F) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase || true
            git push && exit 0
            echo "push failed (attempt $i), retrying in 30 s"; sleep 30
          done
          exit 1

name: probe-run
on:
  push:
    branches: ["probe-run*"]
    paths: ["tools/probe/**", "collector/**", "sources/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collector/collect.py $(cat tools/probe/ids.txt)
        env: {PF_DEBUG_HTML: "1"}
      - name: Install translator (CPU only)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
      - name: Translate titles to English
        continue-on-error: true
        run: python collector/translate.py
      - run: |
          mkdir -p probe_out && cp docs/data/jobs.json debug/items.json probe_out/ && cp -r debug/html probe_out/html 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe_out
          git commit -m "probe run output [skip ci]" || exit 0
          git push
